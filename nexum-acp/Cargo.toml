[package]
name = "nexum-acp"
version.workspace = true
edition.workspace = true
description = "ACP Agent service layer — Session management, Agent construction, Middleware chain, Transport abstraction"

[lib]
name = "nexum_acp"
path = "src/lib.rs"

[dependencies]
nexum-agent = { path = "../nexum-agent" }
nexum-middlewares = { path = "../nexum-middlewares" }
nexum-lsp = { path = "../nexum-lsp" }
langfuse-client = { path = "../langfuse-client" }
agent-client-protocol = { version = "0.14", features = ["unstable"] }
agent-client-protocol-schema = { version = "0.13", features = ["unstable_elicitation"] }
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
libc.workspace = true
uuid.workspace = true
chrono.workspace = true
dashmap = "6"
tokio-util.workspace = true
dirs-next.workspace = true
sqlx.workspace = true
futures.workspace = true
croner = "3"
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
