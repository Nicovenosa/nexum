[package]
name = "nexum-tui"
version.workspace = true
license = "Apache-2.0"
edition.workspace = true
description = "TUI interface for Rust Agent - interactive terminal playground"

[lib]
name = "nexum_tui"
path = "src/lib.rs"

[[bin]]
name = "nexum"
path = "src/main.rs"

[features]
headless = []

[dev-dependencies]
tempfile.workspace = true
[dependencies]
sha2 = { workspace = true }
serde.workspace = true
nexum-agent = { path = "../nexum-agent" }
nexum-middlewares = { path = "../nexum-middlewares" }
nexum-lsp = { path = "../nexum-lsp" }
ratatui = { version = "0.30.1", features = ["unstable-rendered-line-info", "unstable-widget-ref"] }
tokio.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid = { workspace = true, features = ["v7"] }
serde_json.workspace = true
regex = "1"
async-trait.workspace = true
tracing.workspace = true
dirs-next.workspace = true
tui-textarea-2 = "0.11"
parking_lot.workspace = true
arboard = "3"
png = "0.18"
base64 = { version = "0.22", features = ["alloc"] }
nexum-widgets = { path = "../nexum-widgets", features = ["markdown-highlight"] }
nexum-acp = { path = "../nexum-acp" }
nexum-web-pty = { path = "../nexum-web-pty" }
agent-client-protocol = { version = "0.14", features = ["unstable"] }
agent-client-protocol-schema = { version = "0.13", features = ["unstable_elicitation"] }
unicode-width = "0.2"
unicode-segmentation = "1"
clap = { version = "4", features = ["derive"] }
sysinfo.workspace = true
libc.workspace = true
interprocess = { version = "2.4.3", features = ["tokio"] }
fluent = "0.17"
fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["macros"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
aes-gcm = "0.10"
ring = "0.17"
rmp-serde = "1.3"
thiserror.workspace = true
futures-util = "0.3"
fuzzy-matcher = "0.3"

[target.'cfg(not(target_os = "windows"))'.dependencies]
mimalloc.workspace = true
libmimalloc-sys.workspace = true
tikv-jemallocator.workspace = true
tikv-jemalloc-ctl.workspace = true
tikv-jemalloc-sys.workspace = true
