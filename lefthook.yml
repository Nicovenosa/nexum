# lefthook.yml - Git hooks managed by lefthook
# Install: lefthook install
# Run manually: lefthook run pre-commit

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
      fix: cargo fmt --all

    check:
      glob: "*.rs"
      run: cargo check --all-targets

    clippy:
      glob: "*.rs"
      # -D en disallowed_methods, no -W: con warn la regla existe y nadie la
      # aplica, que es volver a disciplina con más pasos. Acá el commit se
      # bloquea. El resto de clippy sigue en -W para no frenar por estilo.
      #
      # Los 26 call sites de temp_dir() del árbol están migrados o con allow
      # justificado en la línea. Uno era un bug de producción: el pid file de
      # voz caía a /tmp/voice.pid con nombre fijo.
      run: cargo clippy --all-targets -- -W clippy::all -D clippy::disallowed_methods

    typos:
      run: typos --ignore-hidden 2>/dev/null || true
